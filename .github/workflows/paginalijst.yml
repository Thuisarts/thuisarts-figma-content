name: Paginalijst bijwerken

on:
  schedule:
    - cron: '0 5 * * 1'   # elke maandag 07:00 Nederlandse tijd (zomertijd)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/maak-paginalijst.mjs
      - name: Wijzigingen committen
        run: |
          if git diff --quiet -- proxy/public/paginas.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy/public/paginas.json
          git commit -m "Paginalijst bijwerken"
          git push
